# Hygiene hooks for project_template ITSELF. The pre-commit config that ships
# into scaffolded projects lives at template/pre-commit-config.yaml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-shebang-scripts-are-executable

  # shellcheck-py is a pip-packaged shellcheck — no Docker daemon required,
  # unlike koalaman/shellcheck-precommit.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
