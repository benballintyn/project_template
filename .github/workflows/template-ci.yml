name: Template CI

# CI for project_template ITSELF (not the projects it scaffolds — those carry
# their own workflows under template/github/). Guards the template's real
# failure mode: a broken scaffold.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck new_project.sh
      - name: bash syntax check
        run: bash -n new_project.sh

  scaffold-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "template-ci"

      - name: Scaffold a project
        run: ./new_project.sh smoketest --docker --desc "template CI smoke test"

      - name: Assert requires-python was pinned (regression guard)
        run: grep -q 'requires-python = ">=3.11,<3.14"' smoketest/pyproject.toml

      - name: Verify the scaffolded project is healthy
        working-directory: smoketest
        run: |
          poetry check
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run pytest
